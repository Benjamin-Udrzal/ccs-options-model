name: Check Telegram Replies

on:
  schedule:
    # Every 5 minutes. GitHub's scheduler doesn't guarantee exact timing under load, but this
    # is a reasonable balance between responsiveness and not hammering the APIs. Adjust the
    # "*/5" below (e.g. "*/2" or "*/10") if you want it tighter or looser.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-replies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check for Telegram replies and log to sheet
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python check_telegram_replies.py

      - name: Commit and push updated state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Telegram reply check $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin master
          git push
