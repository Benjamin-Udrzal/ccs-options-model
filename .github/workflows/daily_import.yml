name: Daily CCS Data Import

on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily import
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python run_daily_import.py

      - name: Commit and push CSV outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Daily data import $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
