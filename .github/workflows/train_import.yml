name: Train Data Import

on:
  workflow_dispatch:
    inputs:
      essential_files_only:
        description: "Only commit the 3 CSVs the pipeline reads (testing, training, summary) and skip the large raw intermediates"
        type: boolean
        default: false
  # No schedule by default — generating a fresh training dataset is a bigger, less routine
  # operation than the daily test import, so this only runs when you click "Run workflow".
  # Add a schedule trigger here (same syntax as daily_import.yml) if you'd like it automatic.

permissions:
  contents: write

jobs:
  run-train-import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run training data import
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: python run_train_import.py

      - name: Commit and push CSV outputs
        env:
          ESSENTIAL_ONLY: ${{ inputs.essential_files_only }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A single push of all the CSVs together can exceed GitHub's request timeout
          # (HTTP 408 / "unexpected disconnect while reading sideband packet"), so this
          # commits and pushes ONE FILE AT A TIME, retrying each push if it fails.
          git config http.postBuffer 524288000

          if [ "$ESSENTIAL_ONLY" = "true" ]; then
            echo "essential_files_only is on: committing only 1.CCS_Testing_Data, 2.CCS_Training_Data and 3.CCS_Summary_Data."
            FIND_ARGS=( \( -name '1.CCS_Testing_Data*.csv' -o -name '2.CCS_Training_Data*.csv' -o -name '3.CCS_Summary_Data*.csv' \) )
          else
            FIND_ARGS=( -name '*.csv' )
          fi

          echo "Output sizes (GitHub rejects any single file over 100 MB):"
          find train_outputs -type f "${FIND_ARGS[@]}" -exec du -h {} +

          push_with_retry() {
            for attempt in 1 2 3 4; do
              if git pull --rebase origin master && git push origin HEAD:master; then
                return 0
              fi
              echo "Push attempt $attempt failed; retrying in $((attempt*15))s..."
              sleep $((attempt*15))
            done
            return 1
          }

          # GitHub permanently rejects any file over 100 MB (error GH001) — retrying can never
          # help, and the rejected commit would also block every later push. So files over
          # ~95 MB are never committed:
          #   - the 3 files the pipeline reads (1., 2., 3.) are essential: too big = fail loudly
          #   - everything else is a raw intermediate nothing downstream reads: skip with a warning
          MAX_BYTES=$((95 * 1024 * 1024))
          ESSENTIAL_RE='/(1\.CCS_Testing_Data|2\.CCS_Training_Data|3\.CCS_Summary_Data)[^/]*\.csv$'
          skipped=0
          committed=0

          # sort -z puts the essential files (1., 2., 3.) first, so if a later file does fail,
          # the folder is still usable by train_model().
          while IFS= read -r -d '' f; do
            size=$(stat -c%s "$f")
            if [ "$size" -gt "$MAX_BYTES" ]; then
              size_mb=$((size / 1024 / 1024))
              if [[ "$f" =~ $ESSENTIAL_RE ]]; then
                echo "::error::$(basename "$f") is ${size_mb} MB, over GitHub's 100 MB limit, and train_model() needs it. Needs Git LFS or a smaller dataset."
                exit 1
              fi
              echo "::warning::Skipping $(basename "$f") (${size_mb} MB) - over GitHub's 100 MB file limit. It is a raw intermediate the pipeline does not read."
              skipped=$((skipped + 1))
              continue
            fi
            git add -- "$f"
            if git diff --cached --quiet; then continue; fi
            git commit -q -m "Train data import: $(basename "$f") ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            push_with_retry
            committed=$((committed + 1))
          done < <(find train_outputs -type f "${FIND_ARGS[@]}" -print0 | sort -z)

          echo "Committed $committed file(s); skipped $skipped oversize file(s)."
