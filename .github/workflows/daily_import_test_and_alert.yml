name: Daily Test and Alert

on:
  schedule:
    # UK clocks change twice a year (BST in summer, GMT in winter), but cron only runs in UTC —
    # so we schedule BOTH possible UTC times for "17:07 Europe/London". There's no longer a
    # clock-based guard step to pick between them: run_daily_test_and_alert.py itself decides,
    # via alerts/alert_log.json, whether today's alert has already been sent. Whichever of these
    # two cron slots fires FIRST on a given day does the real work (regardless of how late a
    # delayed GitHub Actions scheduler actually runs it); the other is a same-day repeat and
    # exits immediately without re-running the import/test. See run_daily_test_and_alert.py for
    # the actual dedup logic.
    - cron: "7 16 * * 1-5"  # = 17:07 London during BST (late Mar - late Oct)
    - cron: "7 17 * * 1-5"  # = 17:07 London during GMT (late Oct - late Mar)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test-and-alert:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily import, test model, and send Telegram alert
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run_daily_test_and_alert.py

      - name: Commit and push outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Daily test + alert $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin master
          git push
